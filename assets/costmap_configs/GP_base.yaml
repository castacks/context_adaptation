---
ROBOT:
  frame_height: 1.85
  front_x: .59 #-0.91-(-1.5)
  back_x: -2.41 #-0.91-(1.5)
  width: .72
VLAD:
  n_clusters: 16
BEHAVIOR:
  buffer_size: 400 #reduce if running slow, try to keep above 1-200
  # residual_max: 36.0
  # uncertainty_threshold: .88
  # residual_max: 27.0
  # uncertainty_threshold: .96
  # residual_max: 26.0 #og
  # residual_max: 29.0 #loftup
  residual_max: 21.0 #jafar dinov2s
  # uncertainty_threshold: .8 # (min threshold for gridmap cell to be high uncertainty/cost) more cost diversity
  uncertainty_threshold: .8
  buffer_update_freq: 2
  # speed_init: 3.0
  max_cost: .15 # (max desired roughness, if exceeding then we slow down) lower means diverse colors in speedmap
  max_velocity: 6
  velocity_margin: 1.0 #high on bag playback since we don't control speed
  costmap_cvar: .03
  unknown_cost: .1
  unknown_speed: 5
  maxpool_speedmap: True
  # adaptation_factor: .001
  # speed_cap: 5.5
  # weighted_avg_speed: False
  trav_model:
    model_type: GP
    # model_type: MLPr
    lengthscale: 3.0
    update_thresh: 10
    train_kernel: False
  speed_model:
    model_type: GP
    lengthscale: 1.5
    update_thresh: 10
    train_kernel: False

MISC:
  update_freq: 5
